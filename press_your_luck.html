<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRESS YOUR LUCK: CHAMPIONSHIP EDITION</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Press+Start+2P&display=swap');

        :root {
            --neon-red: #ff003c;
            --neon-yellow: #f1ff5e;
            --neon-blue: #00d2ff;
            --neon-green: #39ff14;
            --pyl-black: #050505;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--pyl-black);
            background-image: radial-gradient(circle at center, #1a1a2e 0%, #050505 100%);
            color: white; font-family: 'Orbitron', sans-serif;
            overflow: hidden; display: flex; flex-direction: column; align-items: center;
        }

        /* --- STAGE ELEMENTS --- */
        @keyframes chase {
            0%, 100% { border-color: var(--neon-red); box-shadow: 0 0 20px var(--neon-red); }
            33% { border-color: var(--neon-yellow); box-shadow: 0 0 20px var(--neon-yellow); }
            66% { border-color: var(--neon-blue); box-shadow: 0 0 20px var(--neon-blue); }
        }

        .screen {
            position: fixed; inset: 0; display: none;
            flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.95); z-index: 100;
        }

        .active-screen { display: flex; }

        /* --- SETUP & ROUND TRANSITION --- */
        .config-box {
            background: #111; border: 5px solid #444; padding: 30px;
            text-align: center; max-width: 90%; max-height: 80vh; overflow-y: auto;
        }

        .team-row {
            display: flex; gap: 15px; margin: 10px 0; padding: 10px; border-bottom: 1px solid #333;
        }

        input, select {
            background: #000; color: var(--neon-yellow); border: 1px solid #555;
            padding: 8px; font-family: 'Orbitron'; font-weight: bold;
        }

        /* --- SCOREBOARD --- */
        .scoreboard {
            display: flex; justify-content: center; gap: 15px; padding: 20px; width: 100%;
        }

        .player-card {
            background: #121212; border-radius: 8px; border: 3px solid #333;
            width: 200px; padding: 10px; text-align: center; transition: 0.3s;
        }

        .player-card.active {
            border-color: var(--neon-yellow); box-shadow: 0 0 20px var(--neon-yellow); transform: translateY(-5px);
        }

        .player-card.eliminated { opacity: 0.2; filter: grayscale(1); }

        .led-score {
            background: #000; color: var(--neon-blue); font-family: 'Press Start 2P';
            font-size: 1rem; padding: 10px; margin: 8px 0; border: 2px inset #222;
        }

        .spin-tag { font-size: 0.6rem; padding: 3px 6px; border-radius: 4px; margin: 2px; display: inline-block; }

        /* --- GAME BOARD --- */
        .board-outer {
            padding: 10px; border: 10px solid #222; background: #000;
            animation: chase 3s infinite linear;
        }

        .grid {
            display: grid; grid-template-columns: repeat(6, 110px);
            grid-template-rows: repeat(5, 110px); gap: 8px;
        }

        .tile {
            width: 110px; height: 110px; background: #1a1a1a; border: 2px solid #333;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem; text-align: center; overflow: hidden; font-weight: 900;
        }

        .tile.active {
            background: #fff !important; color: #000; border: 5px solid var(--neon-yellow);
            box-shadow: 0 0 30px var(--neon-yellow); z-index: 50; transform: scale(1.1);
        }

        .center-display {
            grid-column: 2 / 6; grid-row: 2 / 5;
            background: radial-gradient(circle, #222 0%, #000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* --- WHAMMY & WINNER --- */
        #whammy-overlay { z-index: 1000; background: rgba(255,0,0,0.9); }
        
        .winner-name {
            font-family: 'Press Start 2P'; font-size: 3rem; color: var(--neon-yellow);
            text-shadow: 0 0 20px var(--neon-yellow); margin: 20px;
        }

        #confetti-canvas {
            position: fixed; inset: 0; pointer-events: none; z-index: 999;
        }

        .btn {
            font-family: 'Press Start 2P'; padding: 15px 30px; border-radius: 50px;
            cursor: pointer; border: 4px solid white; text-transform: uppercase; margin: 10px;
        }
        .btn-spin { background: var(--neon-red); color: white; }
        .btn-stop { background: var(--neon-yellow); color: black; display: none; }
        .btn-pass { background: var(--neon-blue); color: white; }
    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <!-- 1. INITIAL SETUP SCREEN -->
    <div id="setup-screen" class="screen active-screen">
        <div class="config-box">
            <h1 style="color:var(--neon-yellow)">GAME SETUP</h1>
            <div style="margin-bottom:20px;">
                ROUNDS TO PLAY: <input type="number" id="total-rounds" value="2" min="1" style="width:60px">
                TEAMS: <input type="number" id="team-count" value="3" min="2" max="4" style="width:60px" onchange="renderSetup()">
            </div>
            <div id="setup-team-list"></div>
            <button class="btn btn-spin" onclick="startTournament()">BEGIN TOURNAMENT</button>
        </div>
    </div>

    <!-- 2. ROUND SPIN ENTRY (Between Rounds) -->
    <div id="round-screen" class="screen">
        <div class="config-box">
            <h1 id="round-title" style="color:var(--neon-blue)">ROUND 1: SPIN ENTRY</h1>
            <p>Enter spins earned from the trivia round:</p>
            <div id="round-team-list"></div>
            <button class="btn btn-spin" onclick="startRound()">START ROUND</button>
        </div>
    </div>

    <!-- 3. MAIN GAMEPLAY -->
    <div id="game-view" style="display:none; flex-direction:column; align-items:center;">
        <div class="scoreboard" id="scoreboard"></div>
        <div class="board-outer">
            <div class="grid" id="main-grid">
                <div class="center-display">
                    <div id="round-indicator" style="color:var(--neon-blue); font-size:0.8rem; margin-bottom:10px;">ROUND 1</div>
                    <div id="status-text" style="color:var(--neon-yellow); font-size:1.2rem; text-align:center;">BIG BUCKS!</div>
                    <div id="win-display" style="font-size:2.5rem; margin-top:10px;">$0</div>
                </div>
            </div>
        </div>
        <div class="controls">
            <button id="btn-spin" class="btn btn-spin" onclick="handleSpinClick()">SPIN!</button>
            <button id="btn-stop" class="btn btn-stop" onclick="handleStopClick()">STOP!!</button>
            <button id="btn-pass" class="btn btn-pass" onclick="showPassMenu()">PASS</button>
        </div>
    </div>

    <!-- 4. WHAMMY OVERLAY -->
    <div id="whammy-overlay" class="screen">
        <div style="font-size:150px">☹</div>
        <h1 style="font-family:'Press Start 2P'">WHAMMY!</h1>
    </div>

    <!-- 5. WINNER SPLASH -->
    <div id="winner-screen" class="screen">
        <h1 style="font-size:1.5rem">TOURNAMENT CHAMPION</h1>
        <div id="final-winner-name" class="winner-name">TEAM 1</div>
        <div id="final-winner-score" style="font-family:'Press Start 2P'; font-size:2rem; color:var(--neon-green)">$0</div>
        <button class="btn btn-spin" onclick="location.reload()" style="margin-top:50px">NEW GAME</button>
    </div>

    <div id="modal-overlay" class="screen" style="background:rgba(0,0,0,0.9); z-index:2000;">
        <div id="modal-content" class="config-box"></div>
    </div>

    <script>
        // --- GAME STATE ---
        let state = {
            totalRounds: 1, currentRound: 1,
            players: [], activeIdx: 0,
            isSpinning: false, spinInt: null, curTileIdx: 0,
            mode: 'traditional'
        };

        const TILES = [
            {t:"$500", v:500}, {t:"$750", v:750}, {t:"WHAMMY", v:-1},
            {t:"$1000", v:1000}, {t:"$2000", v:2000}, {t:"WHAMMY", v:-1},
            {t:"$3000", v:3000}, {t:"$450", v:450}, {t:"WHAMMY", v:-1},
            {t:"$1500", v:1500}, {t:"$5000", v:5000}, {t:"$600", v:600},
            {t:"WHAMMY", v:-1}, {t:"$800", v:800}, {t:"$1200", v:1200},
            {t:"$2500", v:2500}, {t:"WHAMMY", v:-1}, {t:"$100", v:100}
        ];

        const POSITIONS = [
            {r:1, c:1}, {r:1, c:2}, {r:1, c:3}, {r:1, c:4}, {r:1, c:5}, {r:1, c:6},
            {r:2, c:6}, {r:3, c:6}, {r:4, c:6}, {r:5, c:6}, {r:5, c:5}, {r:5, c:4},
            {r:5, c:3}, {r:5, c:2}, {r:5, c:1}, {r:4, c:1}, {r:3, c:1}, {r:2, c:1}
        ];

        // --- AUDIO ENGINE ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playNote(freq, type, dur, vol=0.1) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.value = freq;
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + dur);
        }

        function playVictoryTheme() {
            const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50];
            notes.forEach((n, i) => {
                setTimeout(() => playNote(n, 'square', 0.6, 0.1), i * 200);
            });
        }

        // --- INITIAL SETUP ---
        function renderSetup() {
            const list = document.getElementById('setup-team-list');
            const count = document.getElementById('team-count').value;
            list.innerHTML = '';
            const colors = [window.getComputedStyle(document.documentElement).getPropertyValue('--neon-red'), '#39ff14', '#00d2ff', '#f1ff5e'];
            for(let i=0; i<count; i++) {
                list.innerHTML += `
                <div class="team-row">
                    NAME: <input type="text" id="setup-n-${i}" value="TEAM ${i+1}" style="width:120px">
                    COLOR: <input type="color" id="setup-c-${i}" value="${colors[i]}">
                </div>`;
            }
        }

        function startTournament() {
            state.totalRounds = parseInt(document.getElementById('total-rounds').value);
            const count = document.getElementById('team-count').value;
            for(let i=0; i<count; i++) {
                state.players.push({
                    id: i, name: document.getElementById(`setup-n-${i}`).value,
                    color: document.getElementById(`setup-c-${i}`).value,
                    score: 0, whammies: 0, earned: 0, passed: 0, out: false
                });
            }
            document.getElementById('setup-screen').classList.remove('active-screen');
            showRoundEntry();
            buildBoard();
        }

        // --- ROUND TRANSITION ---
        function showRoundEntry() {
            document.getElementById('round-title').innerText = `ROUND ${state.currentRound}: SPIN ENTRY`;
            const list = document.getElementById('round-team-list');
            list.innerHTML = '';
            state.players.forEach(p => {
                list.innerHTML += `
                <div class="team-row" style="opacity:${p.out?0.3:1}">
                    <span style="color:${p.color}; width:150px; display:inline-block">${p.name} ${p.out?'(OUT)':''}</span>
                    SPINS EARNED: <input type="number" id="round-s-${p.id}" value="${p.out?0:3}" ${p.out?'disabled':''} style="width:50px">
                </div>`;
            });
            document.getElementById('round-screen').classList.add('active-screen');
        }

        function startRound() {
            state.players.forEach(p => {
                if(!p.out) p.earned = parseInt(document.getElementById(`round-s-${p.id}`).value);
            });
            // First player of round is person with most spins
            state.players.sort((a,b) => b.earned - a.earned);
            state.activeIdx = 0;
            
            document.getElementById('round-screen').classList.remove('active-screen');
            document.getElementById('game-view').style.display = 'flex';
            document.getElementById('round-indicator').innerText = `ROUND ${state.currentRound} OF ${state.totalRounds}`;
            refreshUI();
            checkTurnRotation();
        }

        // --- BOARD LOGIC ---
        function buildBoard() {
            const grid = document.getElementById('main-grid');
            POSITIONS.forEach((pos, i) => {
                const div = document.createElement('div');
                div.className = 'tile'; div.id = `tile-${i}`;
                div.style.gridRow = pos.r; div.style.gridColumn = pos.c;
                div.innerHTML = TILES[i].t;
                if(TILES[i].v === -1) div.style.color = 'red';
                grid.appendChild(div);
            });
        }

        function handleSpinClick() {
            if(state.isSpinning) return;
            if(audioCtx.state === 'suspended') audioCtx.resume();
            state.isSpinning = true;
            document.getElementById('btn-spin').style.display = 'none';
            document.getElementById('btn-pass').style.display = 'none';
            document.getElementById('btn-stop').style.display = 'block';
            
            state.spinInt = setInterval(() => {
                document.getElementById(`tile-${state.curTileIdx}`).classList.remove('active');
                state.curTileIdx = Math.floor(Math.random() * TILES.length);
                document.getElementById(`tile-${state.curTileIdx}`).classList.add('active');
                playNote(300 + (state.curTileIdx * 20), 'square', 0.05, 0.02);
            }, 60);
        }

        function handleStopClick() {
            clearInterval(state.spinInt);
            state.isSpinning = false;
            document.getElementById('btn-stop').style.display = 'none';
            document.getElementById('btn-spin').style.display = 'block';

            const p = state.players[state.activeIdx];
            if(p.passed > 0) p.passed--; else p.earned--;

            const res = TILES[state.curTileIdx];
            if(res.v === -1) {
                p.score = 0; p.whammies++; 
                p.earned += p.passed; p.passed = 0; // Traditional Redirect
                if(p.whammies >= 3) p.out = true;
                showWhammy();
            } else {
                p.score += res.v;
                document.getElementById('win-display').innerText = res.t;
                playNote(800, 'sine', 0.5, 0.1);
                checkTurnRotation();
            }
        }

        function showWhammy() {
            document.getElementById('whammy-overlay').classList.add('active-screen');
            playNote(100, 'sawtooth', 1.5, 0.2);
            setTimeout(() => {
                document.getElementById('whammy-overlay').classList.remove('active-screen');
                checkTurnRotation();
            }, 2000);
        }

        function checkTurnRotation() {
            let count = 0;
            while(count < state.players.length) {
                const p = state.players[state.activeIdx];
                if(!p.out && (p.earned > 0 || p.passed > 0)) {
                    refreshUI(); return;
                }
                state.activeIdx = (state.activeIdx + 1) % state.players.length;
                count++;
            }
            endOfRound();
        }

        function endOfRound() {
            if(state.currentRound < state.totalRounds) {
                state.currentRound++;
                document.getElementById('game-view').style.display = 'none';
                showRoundEntry();
            } else {
                showFinalWinner();
            }
        }

        function refreshUI() {
            const sb = document.getElementById('scoreboard');
            sb.innerHTML = '';
            state.players.forEach((p, i) => {
                const active = (i === state.activeIdx && !p.out);
                sb.innerHTML += `
                <div class="player-card ${active?'active':''} ${p.out?'eliminated':''}" style="border-bottom: 5px solid ${p.color}">
                    <div style="font-size:0.7rem; color:${p.color}">${p.name}</div>
                    <div class="led-score">$${p.score.toLocaleString()}</div>
                    <div class="spin-tag" style="background:#006600">E: ${p.earned}</div>
                    <div class="spin-tag" style="background:#660000">P: ${p.passed}</div>
                    <div style="color:red; margin-top:4px; font-size:12px;">${"X ".repeat(p.whammies)}</div>
                </div>`;
            });
            const curr = state.players[state.activeIdx];
            document.getElementById('btn-pass').style.display = (curr.earned > 0 && curr.passed === 0) ? 'block' : 'none';
            document.getElementById('status-text').innerText = (curr.passed > 0) ? "MUST SPIN!" : "YOUR TURN";
        }

        function showPassMenu() {
            const p = state.players[state.activeIdx];
            const others = state.players.filter(o => o.id !== p.id && !o.out);
            const modal = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            modal.classList.add('active-screen');
            content.innerHTML = `<h2>PASS ${p.earned} SPINS TO:</h2>`;
            others.forEach(o => {
                content.innerHTML += `<button class="btn" style="background:${o.color}; color:black" onclick="doPass(${o.id})">${o.name}</button>`;
            });
            content.innerHTML += `<br><button class="btn" onclick="document.getElementById('modal-overlay').classList.remove('active-screen')">CANCEL</button>`;
        }

        window.doPass = (id) => {
            const cp = state.players[state.activeIdx];
            const tp = state.players.find(x => x.id === id);
            tp.passed += cp.earned; cp.earned = 0;
            document.getElementById('modal-overlay').classList.remove('active-screen');
            checkTurnRotation();
        }

        // --- THE BIG FINISH ---
        function showFinalWinner() {
            document.getElementById('game-view').style.display = 'none';
            const winner = [...state.players].sort((a,b) => b.score - a.score)[0];
            document.getElementById('final-winner-name').innerText = winner.name;
            document.getElementById('final-winner-score').innerText = `$${winner.score.toLocaleString()}`;
            document.getElementById('winner-screen').classList.add('active-screen');
            
            playVictoryTheme();
            initConfetti();
        }

        // --- CONFETTI ENGINE ---
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function initConfetti() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            for(let i=0; i<150; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    r: Math.random() * 6 + 4,
                    d: Math.random() * 10,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                    tilt: Math.random() * 10 - 10
                });
            }
            requestAnimationFrame(drawConfetti);
        }

        function drawConfetti() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            particles.forEach(p => {
                p.y += Math.cos(p.d) + 3;
                p.tilt = Math.sin(p.d) * 15;
                ctx.beginPath(); ctx.lineWidth = p.r; ctx.strokeStyle = p.color;
                ctx.moveTo(p.x + p.tilt + p.r/2, p.y);
                ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r/2);
                ctx.stroke();
                if(p.y > canvas.height) p.y = -20;
            });
            requestAnimationFrame(drawConfetti);
        }

        window.addEventListener('keydown', (e) => {
            if(e.code === 'Space') state.isSpinning ? handleStopClick() : handleSpinClick();
        });

        renderSetup();
    </script>
</body>
</html>
